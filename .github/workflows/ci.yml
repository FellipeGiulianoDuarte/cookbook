name: CI

on:
  push:
    branches: [main]
  pull_request:
  deployment_status:

jobs:
  check:
    if: github.event_name != 'deployment_status'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome ci .
      - run: pnpm exec next typegen
      - run: pnpm exec tsc --noEmit
      - run: pnpm vitest run

  e2e:
    # Runs against the live site once Vercel reports the production deployment as ready.
    # Per-deployment URLs (…-fellipes-projects-….vercel.app) sit behind Vercel Authentication
    # and answer with a login page, so the job targets the public production alias instead.
    # Preview deployments are not tested here; that needs a protection-bypass secret.
    if: github.event_name == 'deployment_status' && github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm exec playwright test
        env:
          E2E_BASE_URL: https://duartes-cookbook.vercel.app
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
